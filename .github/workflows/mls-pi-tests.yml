name: Test MLS Pi Extension

on:
  push:
    paths:
      - 'packages/mls-pi/**'
      - 'skills/**'
      - 'templates/**'
  pull_request:
    paths:
      - 'packages/mls-pi/**'
      - 'skills/**'
      - 'templates/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: packages/mls-pi
        run: npm install

      - name: Compile TypeScript
        working-directory: packages/mls-pi
        run: npm run build

      - name: Run tests
        working-directory: packages/mls-pi
        run: npm test
