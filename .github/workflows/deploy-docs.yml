name: Deploy MLST Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/mlst-pi/docs/**'
      - 'packages/mlst-pi/package.json'
      - 'packages/mlst-pi/package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # VitePress uses git history for lastUpdated timestamps

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/mlst-pi/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci
        working-directory: packages/mlst-pi

      - name: Build docs
        run: npm run docs:build
        working-directory: packages/mlst-pi

      # Pages maps the artifact root to /my-little-scrum-team/, so the site has
      # to live in an `mlst-pi/` directory to be served at
      # /my-little-scrum-team/mlst-pi/. This must match `base` in
      # packages/mlst-pi/docs/.vitepress/config.ts.
      - name: Stage site under /mlst-pi/
        run: |
          set -euo pipefail
          mkdir -p _site/mlst-pi
          cp -R packages/mlst-pi/docs/.vitepress/dist/. _site/mlst-pi/
          # Redirect the Pages root to the docs rather than serving a bare 404.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>My Little Scrum Team</title>
          <meta http-equiv="refresh" content="0; url=./mlst-pi/">
          <link rel="canonical" href="./mlst-pi/">
          <p><a href="./mlst-pi/">My Little Scrum Team documentation</a></p>
          HTML
          test -f _site/mlst-pi/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
